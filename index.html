<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingsprotokoll</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFE5D5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17120E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #EFE5D5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100%; }
  @media (prefers-color-scheme: dark) { body { background: #17120E; } }

  /* Platz fuer Notch / Dynamic Island im Vollbildmodus */
  .tp .wrap { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .tp button { -webkit-touch-callout: none; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 15px -apple-system, BlinkMacSystemFont, sans-serif; color: #7A6753;
  }
</style>
</head>

<div id="root"><div id="boot">Trainingsprotokoll wird geladen …</div></div>

.tp * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.tp {
  --beige:#EFE5D5; --sand:#F8F3EA; --field:#FFFFFF;
  --ink:#2C2016; --ink-soft:#7A6753;
  --brown:#6A4A30; --accent:#9C6632; --accent-soft:rgba(156,102,50,.15);
  --done:#4F6B46; --dev:#AE551F;
  --line:rgba(70,50,32,.16);
  --glass:rgba(255,252,246,.55);
  --glass-2:rgba(255,252,246,.34);
  --glass-strong:rgba(255,252,246,.80);
  --hl:rgba(255,255,255,.70);
  --shadow:0 10px 30px rgba(62,44,28,.13);
  --deep:rgba(46,33,23,.82);
  --on-deep:#F7F0E4;
  --focus:#2F5FA8;
  position: relative;
  background: var(--beige);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, ui-sans-serif, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  min-height: 100%;
  font-size: 16px; line-height: 1.45;
  padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
.tp::before{
  content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(85vw 55vh at 10% -8%, rgba(226,192,148,.85), transparent 60%),
    radial-gradient(70vw 45vh at 98% 6%, rgba(156,102,50,.32), transparent 58%),
    radial-gradient(90vw 55vh at 45% 106%, rgba(106,74,48,.32), transparent 60%),
    linear-gradient(180deg,#F5ECDD 0%,#EADCC6 52%,#DFCDB2 100%);
}
.tp > * { position: relative; z-index: 1; }

@media (prefers-color-scheme: dark){
  .tp{
    --beige:#17120E; --sand:#241C15; --field:rgba(255,255,255,.07);
    --ink:#F3EADC; --ink-soft:#B4A28C;
    --brown:#C79A6B; --accent:#D9A566; --accent-soft:rgba(217,165,102,.20);
    --done:#84AC7C; --dev:#E0834A;
    --line:rgba(255,240,220,.16);
    --glass:rgba(66,51,39,.52);
    --glass-2:rgba(66,51,39,.32);
    --glass-strong:rgba(58,45,34,.82);
    --hl:rgba(255,235,205,.15);
    --shadow:0 12px 34px rgba(0,0,0,.45);
    --deep:rgba(26,19,13,.86);
  }
  .tp::before{
    background:
      radial-gradient(85vw 55vh at 10% -8%, rgba(120,84,50,.50), transparent 60%),
      radial-gradient(70vw 45vh at 98% 6%, rgba(82,57,34,.52), transparent 58%),
      radial-gradient(90vw 55vh at 45% 106%, rgba(54,39,26,.70), transparent 60%),
      linear-gradient(180deg,#1B1510 0%,#120E0A 100%);
  }
}

.tp .wrap { max-width: 540px; margin: 0 auto; padding: 18px 16px 0; will-change: transform; }
.tp.notabs { padding-bottom: calc(176px + env(safe-area-inset-bottom, 0px)); }
.tp.notabs.resting { padding-bottom: calc(268px + env(safe-area-inset-bottom, 0px)); }
.tp .num { font-variant-numeric: tabular-nums; }
.tp button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
.tp button:focus-visible, .tp input:focus-visible, .tp textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- Glas-Grundbaustein ---------- */
.tp .g,
.tp .edit,
.tp .setrow,
.tp .sesscard,
.tp .card {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--hl);
  border-radius: 22px;
  box-shadow: inset 0 1px 0 var(--hl), var(--shadow);
}

/* ---------- Typo ---------- */
.tp .eyebrow { font-size: 13px; color: var(--ink-soft); }
.tp h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; margin: 2px 0 14px; }
.tp h2 { font-size: 20px; font-weight: 640; letter-spacing: -0.015em; margin: 0; }
.tp .head { font-size: 27px; font-weight: 700; letter-spacing: -0.025em; margin: 2px 0 16px; }
.tp p { margin: 0 0 10px; }

/* ---------- Startseite ---------- */
.tp .hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.tp .hello .big { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }
.tp .hello .day { flex: 0 0 auto; font-size: 13px; color: var(--ink-soft); text-align: right; line-height: 1.35; }

.tp .quotecard { padding: 20px 20px 18px; margin-bottom: 14px; }
.tp .quotecard .mark { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 9px; }
.tp .quote { font-size: 21px; line-height: 1.34; font-weight: 600; letter-spacing: -0.018em; margin: 0; }

.tp .hero { padding: 18px; margin-bottom: 12px; }
.tp .hero .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 650; }
.tp .hero .row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
.tp .hero .name { font-size: 19px; font-weight: 660; letter-spacing: -0.015em; }
.tp .hero .meta { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }

.tp .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.tp .card { padding: 16px; }
.tp .card .k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 650; }
.tp .card .v { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-top: 6px; }
.tp .card .s { font-size: 13px; color: var(--ink-soft); margin-top: 3px; line-height: 1.35; }
.tp .card.wide { grid-column: 1 / -1; }
.tp .ringrow { display: flex; align-items: center; gap: 14px; }

/* ---------- Karten & Banner ---------- */
.tp .resume { background: var(--deep); color: var(--on-deep); border-radius: 22px; padding: 18px;
  margin-bottom: 12px; -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,.14); box-shadow: var(--shadow); }
.tp .resume .acts { display: flex; gap: 8px; margin-top: 14px; }
.tp .resume .acts button { flex: 1; border: 1px solid rgba(247,240,228,.30); border-radius: 14px; padding: 13px; font-size: 14.5px; }
.tp .resume .acts button.go { background: var(--on-deep); color: #2C2016; font-weight: 650; border-color: var(--on-deep); }

.tp .banner { background: var(--glass-2); -webkit-backdrop-filter: blur(20px) saturate(170%);
  backdrop-filter: blur(20px) saturate(170%); border: 1px solid var(--hl); border-left: 3px solid var(--accent);
  border-radius: 20px; padding: 15px 17px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; box-shadow: var(--shadow); }
.tp .banner b { font-weight: 660; }

.tp .weekline { display: flex; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line); padding-bottom: 10px; margin: 0 0 14px; }

.tp .sesscard { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  width: 100%; text-align: left; padding: 15px; margin-bottom: 11px; }
.tp .sesscard.done { opacity: .52; cursor: default; }
.tp .glyph { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
  width: 56px; height: 56px; display: grid; place-items: center; border-radius: 18px;
  background: var(--accent-soft); color: var(--accent); }
.tp .sesscard.done .glyph { background: transparent; border: 2px solid var(--done); color: var(--done); }
.tp .sessmeta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }

/* ---------- Training ---------- */
.tp .bar { display: flex; gap: 5px; margin: 0 0 18px; }
.tp .bar i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.tp .bar i.on { background: var(--accent); }

.tp .setrow { display: grid; grid-template-columns: 26px 1fr 58px; align-items: center; gap: 10px;
  padding: 13px 13px 13px 15px; margin-bottom: 10px; min-height: 68px; }
.tp .setrow.on { background: var(--deep); border-color: rgba(255,255,255,.16); color: var(--on-deep); }
.tp .setrow.dev { background: rgba(174,85,31,.88); border-color: rgba(255,255,255,.18); color: #FDF4EC; }
.tp .setno { font-size: 14px; opacity: .6; }
.tp .vals { font-size: 22px; font-weight: 660; letter-spacing: -0.015em; text-align: left; width: 100%; }
.tp .vals small { font-size: 12.5px; font-weight: 450; opacity: .7; display: block; letter-spacing: 0; }
.tp .tick { width: 52px; height: 48px; border-radius: 16px; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 21px; background: transparent; }
.tp .setrow.on .tick, .tp .setrow.dev .tick { border-color: currentColor; }

.tp .edit { padding: 15px; margin-bottom: 10px; }
.tp .stepper { display: grid; grid-template-columns: 54px 1fr 54px; gap: 9px; align-items: center; margin-top: 8px; }
.tp .stepper button { border: 1px solid var(--line); border-radius: 15px; height: 48px; font-size: 21px;
  background: var(--glass-strong); }
.tp input.plain { height: 52px; width: 100%; font-size: 21px; font-weight: 640; padding: 0 15px;
  border: 1px solid var(--line); border-radius: 15px; background: var(--field); color: var(--ink);
  font-variant-numeric: tabular-nums; margin-top: 8px; }
.tp .stepper input { height: 48px; text-align: center; font-size: 20px; font-weight: 640; width: 100%;
  border: 1px solid var(--line); border-radius: 15px; background: var(--field); color: var(--ink);
  font-variant-numeric: tabular-nums; }

/* ---------- Buttons ---------- */
.tp .btn { display: block; width: 100%; border-radius: 18px; padding: 17px; font-size: 16.5px;
  font-weight: 640; text-align: center; }
.tp .btn.primary { background: var(--deep); color: var(--on-deep); box-shadow: var(--shadow); }
.tp .btn.ghost { border: 1px solid var(--hl); background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
  box-shadow: inset 0 1px 0 var(--hl); }
.tp .btn.quiet { color: var(--ink-soft); font-weight: 500; font-size: 14.5px; padding: 12px; }
.tp .btn.mini { width: auto; padding: 12px 18px; font-size: 15px; border-radius: 16px; }
.tp .back { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft);
  font-size: 14.5px; padding: 2px 0 14px; }

.tp .note { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 10px 0 16px; }
.tp textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 18px;
  padding: 14px; font: inherit; background: var(--field); color: var(--ink); resize: vertical; }

/* ---------- Pausen-Timer ---------- */
.tp .rest { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  z-index: 25; background: var(--deep); color: var(--on-deep); border-radius: 26px;
  border: 1px solid rgba(255,255,255,.15); box-shadow: 0 16px 40px rgba(30,20,12,.34);
  -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%); }
.tp.notabs .rest { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.tp .rest .inner { max-width: 540px; margin: 0 auto; padding: 17px 18px 18px; }
.tp .rest .top { display: flex; align-items: baseline; gap: 14px; }
.tp .rest .t { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.tp .rest .lbl { font-size: 14.5px; opacity: .72; flex: 1; text-align: right; }
.tp .rest .track { height: 6px; background: rgba(247,240,228,.22); border-radius: 3px; margin-top: 13px; overflow: hidden; }
.tp .rest .track i { display: block; height: 100%; background: var(--on-deep); }
.tp .rest .acts { display: flex; gap: 8px; margin-top: 13px; }
.tp .rest .acts button { flex: 1; border: 1px solid rgba(247,240,228,.30); border-radius: 14px; padding: 12px 6px; font-size: 14px; }
.tp .rest.cd .t { color: #F0C24B; }
.tp .rest.cd .track i { background: #F0C24B; }
.tp .rest.fin { background: rgba(79,107,70,.90); }
.tp .rest.fin .track i { background: var(--on-deep); }

/* ---------- Tab-Leiste ---------- */
.tp .tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 30; border-radius: 28px; background: var(--glass-strong);
  -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--hl); box-shadow: inset 0 1px 0 var(--hl), 0 12px 32px rgba(50,35,22,.20); }
.tp .tabs .inner { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tp .tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 9px 2px 10px; min-height: 64px; font-size: 10.5px; font-weight: 550; color: var(--ink-soft); }
.tp .tabs .ico { width: 46px; height: 30px; display: grid; place-items: center; border-radius: 15px; }
.tp .tabs button.on { color: var(--accent); font-weight: 680; }
.tp .tabs button.on .ico { background: var(--accent-soft); }
@media (prefers-reduced-motion: no-preference) {
  .tp .tabs .ico { transition: background .18s ease; }
  .tp .setrow { transition: background .14s ease; }
}

/* ---------- Kleinkram ---------- */
.tp .chip { display: inline-block; border: 1px solid var(--hl); border-radius: 999px; padding: 8px 14px;
  font-size: 13.5px; margin: 0 7px 7px 0; background: var(--glass); }
.tp .hrow { border-bottom: 1px solid var(--line); padding: 15px 2px; width: 100%; text-align: left; }
.tp .warn { border: 1px solid var(--dev); color: var(--dev); border-radius: 18px; padding: 13px 15px;
  font-size: 14px; margin-bottom: 14px; background: var(--glass-2); }
.tp .kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--line); font-size: 14.5px; }
.tp .kv span:first-child { color: var(--ink-soft); }
